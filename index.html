/* 主界面时代线横线样式 */
.timeline-horizontal {
    margin: 16px 0 8px 0;
    padding: 16px 0;
    background: #f9f9fb;
    border-radius: 12px;
    overflow-x: auto;
}
.timeline-horizontal-title {
    font-size: 12px;
    font-weight: 500;
    color: #8e8e93;
    margin-bottom: 12px;
    padding: 0 16px;
}
.timeline-track {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-around;
    min-width: 300px;
    padding: 0 16px;
}
.timeline-line {
    position: absolute;
    top: 50%;
    left: 50px;
    right: 50px;
    height: 2px;
    background: #c6c6c8;
    transform: translateY(-50%);
    z-index: 0;
}
.timeline-node {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
}
.timeline-dot {
    width: 10px;
    height: 10px;
    background: #61A2DA;
    border-radius: 50%;
    border: 2px solid white;
    box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    margin-bottom: 6px;
}
.timeline-label {
    font-size: 12px;
    font-weight: 500;
    color: #1c1c1e;
    white-space: nowrap;
    background: white;
    padding: 2px 8px;
    border-radius: 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
}
.timeline-node:hover .timeline-label {
    background: #61A2DA;
    color: white;
}
.timeline-node:hover .timeline-dot {
    background: #ff9500;
    transform: scale(1.2);
}



/* 相关事件标签样式 */
.event-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;

<script>
    
    // 解析年份字符串（支持：公元前259年、259年、-259、259BC等）
function parseYear(yearStr) {
    if (!yearStr || yearStr.trim() === '') return null;
    let str = yearStr.trim();
    let isBC = false;
    let year = 0;
    
    // 匹配 "公元前259年" 或 "前259年" 或 "259BC" 或 "-259"
    if (str.includes('公元前') || str.includes('前') || str.includes('BC') || str.includes('bc')) {
        isBC = true;
        // 提取数字
        const match = str.match(/\d+/);
        if (match) year = parseInt(match[0]);
    } else if (str.startsWith('-')) {
        isBC = true;
        year = parseInt(str.substring(1));
    } else {
        // 公元后，直接提取数字
        const match = str.match(/\d+/);
        if (match) year = parseInt(match[0]);
    }
    
    if (year === 0) return null;
    return { year, isBC };
}

// 计算年龄/跨度
function calculateLifespan() {
    const birthStr = document.getElementById('birthYear').value;
    const deathStr = document.getElementById('deathYear').value;
    const resultDiv = document.getElementById('lifespanResult');
    
    const birth = parseYear(birthStr);
    const death = parseYear(deathStr);
    
    if (!birth && !death) {
        resultDiv.innerHTML = '📅 待完善';
        resultDiv.style.background = '#f2f2f6';
        resultDiv.style.color = '#8e8e93';
        return '';
    }
    
    if (!birth) {
        resultDiv.innerHTML = `📅 卒于 ${deathStr}`;
        resultDiv.style.background = '#f2f2f6';
        resultDiv.style.color = '#8e8e93';
        return deathStr;
    }
    
    if (!death) {
        resultDiv.innerHTML = `📅 生于 ${birthStr}`;
        resultDiv.style.background = '#f2f2f6';
        resultDiv.style.color = '#8e8e93';
        return birthStr;
    }
    
    // 计算年龄（公元前用负数表示）
    let birthNum = birth.isBC ? -birth.year : birth.year;
    let deathNum = death.isBC ? -death.year : death.year;
    
    let age = deathNum - birthNum;
    
    if (age < 0) {
        resultDiv.innerHTML = `⚠️ 生卒顺序有误`;
        resultDiv.style.background = '#ff3b3010';
        resultDiv.style.color = '#ff3b30';
        return `${birthStr} - ${deathStr}`;
    }
    
    // 格式化显示
    let resultText = '';
    if (age === 0) {
        resultText = `📅 同年`;
    } else if (age === 1) {
        resultText = `📅 享年 ${age} 岁`;
    } else {
        resultText = `📅 享年 ${age} 岁`;
    }
    
    resultDiv.innerHTML = resultText;
    resultDiv.style.background = '#61A2DA20';
    resultDiv.style.color = '#61A2DA';
    return `${birthStr} - ${deathStr}`;
}

// 监听输入变化
function bindLifespanEvents() {
    const birthInput = document.getElementById('birthYear');
    const deathInput = document.getElementById('deathYear');
    if (birthInput) {
        birthInput.addEventListener('input', () => {
            calculateLifespan();
            // 实时更新显示的生卒年字符串
            const lifespanStr = `${birthInput.value || '?'} - ${deathInput?.value || '?'}`;
            document.getElementById('editLifespanHidden')?.setAttribute('value', lifespanStr);
        });
    }
    if (deathInput) {
        deathInput.addEventListener('input', () => {
            calculateLifespan();
            const lifespanStr = `${birthInput?.value || '?'} - ${deathInput.value || '?'}`;
            document.getElementById('editLifespanHidden')?.setAttribute('value', lifespanStr);
        });
    }
}

function getAllLeafNodes(tree, path = []) {
    let leaves = [];
    for (let node of tree) {
        if (node.children?.length) {
            leaves.push(...getAllLeafNodes(node.children, [...path, node.name]));
        } else {
            leaves.push({ 
                id: node.id, 
                name: node.name, 
                cleanName: node.name.replace(/^《|》$/g, ''),
                fullPath: [...path, node.name].join(' · ')  // 完整路径包含自己
            });
        }
    }
    return leaves;
}

// 将带缩进的 HTML 转换成可折叠的大纲结构
function convertToOutline(html) {
    // 创建临时容器解析 HTML
    const temp = document.createElement('div');
    temp.innerHTML = html;
    
    // 递归处理所有带缩进的元素
    function processElement(el, level = 0) {
        if (!el) return '';
        
        let result = '';
        const children = Array.from(el.childNodes);
        
        for (let i = 0; i < children.length; i++) {
            const node = children[i];
            
            // 处理文本节点
            if (node.nodeType === Node.TEXT_NODE) {
                const text = node.textContent.trim();
                if (text) {
                    result += `<div class="outline-item" data-level="${level}">
                        <span class="bullet" onclick="toggleOutlineItem(this)">▼</span>
                        <span class="content">${escapeHtml(text)}</span>
                    </div>`;
                }
                continue;
            }
            
            // 处理元素节点
            if (node.nodeType === Node.ELEMENT_NODE) {
                const tagName = node.tagName.toLowerCase();
                const className = node.className || '';
                
                // 检查缩进级别
                let indent = 0;
                if (className.includes('ql-indent-')) {
                    const match = className.match(/ql-indent-(\d+)/);
                    if (match) indent = parseInt(match[1]);
                }
                
                // 获取元素文本
                const nodeText = node.textContent.trim();
                if (!nodeText) continue;
                
                if (indent > 0) {
                    // 有缩进的项，作为子项
                    result += `<div class="outline-item" data-level="${indent}" data-parent-level="${indent - 1}">
                        <span class="bullet" onclick="toggleOutlineItem(this)">▼</span>
                        <span class="content">${node.innerHTML.replace(/<[^>]*>/g, '')}</span>
                    </div>`;
                } else if (tagName === 'p' || tagName === 'div') {
                    // 普通段落
                    if (node.innerHTML && node.innerHTML.trim()) {
                        result += `<div class="outline-item" data-level="0">
                            <span class="bullet" onclick="toggleOutlineItem(this)">▼</span>
                            <span class="content">${node.innerHTML}</span>
                        </div>`;
                    }
                } else if (tagName === 'ul' || tagName === 'ol') {
                    // 处理列表
                    const items = node.querySelectorAll('li');
                    items.forEach((li, idx) => {
                        const liText = li.textContent.trim();
                        if (liText) {
                            result += `<div class="outline-item" data-level="${level}">
                                <span class="bullet" onclick="toggleOutlineItem(this)">▼</span>
                                <span class="content">${li.innerHTML}</span>
                            </div>`;
                        }
                    });
                } else {
                    // 其他元素
                    if (node.innerHTML && node.innerHTML.trim()) {
                        result += `<div class="outline-item" data-level="${level}">
                            <span class="bullet" onclick="toggleOutlineItem(this)">▼</span>
                            <span class="content">${node.innerHTML}</span>
                        </div>`;
                    }
                }
            }
        }
        
        // 根据缩进级别组织父子关系
        return buildOutlineTree(result);
    }
    
    function buildOutlineTree(flatHtml) {
        // 简单实现：用正则按层级包裹
        const lines = flatHtml.split('</div>');
        let result = '';
        let stack = [];
        
        for (let line of lines) {
            if (!line.trim()) continue;
            const levelMatch = line.match(/data-level="(\d+)"/);
            if (!levelMatch) {
                result += line + '</div>';
                continue;
            }
            const level = parseInt(levelMatch[1]);
            
            // 关闭不需要的层级
            while (stack.length > level) {
                result += '</div>';
                stack.pop();
            }
            
            // 开启新的层级
            if (stack.length === level) {
                // 同级，先关闭上一个再开新
                if (result.endsWith('</div>')) {
                    result += '<div class="outline-children">' + line + '</div>';
                } else {
                    result += line + '</div>';
                }
            } else if (stack.length < level) {
                // 子级，需要包裹
                result += '<div class="outline-children">' + line + '</div>';
                stack.push(level);
            }
        }
        
        while (stack.length > 0) {
            result += '</div>';
            stack.pop();
        }
        
        return result || flatHtml;
    }
    
    return processElement(temp) || html;
}

// 折叠/展开函数
window.toggleOutlineItem = function(bullet) {
    const item = bullet.closest('.outline-item');
    if (!item) return;
    
    // 找到下一个 outline-children
    let next = item.nextElementSibling;
    while (next && !next.classList.contains('outline-children')) {
        next = next.nextElementSibling;
    }
    
    if (next && next.classList.contains('outline-children')) {
        if (next.style.display === 'none') {
            next.style.display = 'block';
            bullet.innerHTML = '▼';
        } else {
            next.style.display = 'none';
            bullet.innerHTML = '▶';
        }
    }
};

function bindInlineEditors() {
    console.log('bindInlineEditors 被调用，找到元素:', document.querySelectorAll('.editable-inline').length);
    
    document.querySelectorAll('.editable-inline').forEach(el => {
        // 移除旧的监听器
        if (el._dblclickHandler) {
            el.removeEventListener('dblclick', el._dblclickHandler);
        }
        
        const handler = (e) => {
            e.stopPropagation();
            console.log('双击触发:', el.dataset.field);
            
            if (activeEditorElement && activeEditorElement !== el) {
                saveAndCloseEditor(activeEditorElement);
            }
            
            const field = el.dataset.field;
            const noteId = parseInt(el.dataset.id);
            const originalHtml = el.innerHTML;
            
            el.setAttribute('contenteditable', 'true');
            el.style.cssText = `
                outline: 2px solid #61A2DA;
                border-radius: 8px;
                background-color: #ffffff;
                padding: 4px 8px;
                cursor: text;
                text-align: left;
                color: #1c1c1e;
                white-space: pre-wrap;
                word-wrap: break-word;
                line-height: 1.4;
            `;
            
            el._originalHtml = originalHtml;
            el._field = field;
            el._noteId = noteId;
            activeEditorElement = el;
            
            el.focus();
            
            const range = document.createRange();
            const sel = window.getSelection();
            range.selectNodeContents(el);
            range.collapse(false);
            sel.removeAllRanges();
            sel.addRange(range);
            
            const saveOnBlur = () => {
                if (activeEditorElement === el) {
                    saveAndCloseEditor(el);
                }
            };
            
            el.addEventListener('blur', saveOnBlur, { once: true });
            
            const handleKeyDown = (e) => {
                if (e.key === 'Escape') {
                    e.preventDefault();
                    cancelEdit(el);
                    el.removeEventListener('keydown', handleKeyDown);
                }
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    el.blur();
                }
                if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey && !e.shiftKey) {
                    e.preventDefault();
                    const selection = window.getSelection();
                    if (!selection.rangeCount) return;
                    const range = selection.getRangeAt(0);
                    const br = document.createElement('br');
                    range.deleteContents();
                    range.insertNode(br);
                    range.setStartAfter(br);
                    range.setEndAfter(br);
                    selection.removeAllRanges();
                    selection.addRange(range);
                }
            };
            el.addEventListener('keydown', handleKeyDown);
            
            el._blurHandler = saveOnBlur;
            el._keydownHandler = handleKeyDown;
        };
        
        el._dblclickHandler = handler;
        el.addEventListener('dblclick', handler);
        el.style.cursor = 'pointer';
        el.title = '双击编辑（点击外部自动保存）';
    });
}

function saveAndCloseEditor(el) {
    if (!el || el.getAttribute('contenteditable') !== 'true') return;
    
    const newHtml = el.innerHTML;
    const originalHtml = el._originalHtml;
    const field = el._field;
    const noteId = el._noteId;
    
    el.removeAttribute('contenteditable');
    el.style.cssText = '';
    el.style.cursor = 'pointer';
    
    if (newHtml !== originalHtml) {
        const noteIndex = notes.findIndex(n => n.id === noteId);
        if (noteIndex !== -1) {
            notes[noteIndex][field] = newHtml;
            notes[noteIndex].updatedAt = new Date().toISOString();
            saveNotes();
            console.log(`保存 ${field}:`, newHtml.substring(0, 50));
            renderRecords();
            showMsg('✅ 已自动保存');
        }
    }
    
    if (el._blurHandler) {
        el.removeEventListener('blur', el._blurHandler);
    }
    if (el._keydownHandler) {
        el.removeEventListener('keydown', el._keydownHandler);
    }
    
    activeEditorElement = null;
}

function cancelEdit(el) {
    if (!el || el.getAttribute('contenteditable') !== 'true') return;
    
    el.innerHTML = el._originalHtml;
    
    el.removeAttribute('contenteditable');
    el.style.cssText = '';
    el.style.cursor = 'pointer';
    
    if (el._blurHandler) {
        el.removeEventListener('blur', el._blurHandler);
    }
    if (el._keydownHandler) {
        el.removeEventListener('keydown', el._keydownHandler);
    }
    
    activeEditorElement = null;
    showMsg('已取消编辑');
}

function showGraph() {
    const currentNote = notes.find(n => n.classic === currentClassic && n.chapter === currentChapter);
    if (!currentNote) {
        showMsg('暂无笔记数据');
        return;
    }
    
    const isClassic = ['lunyu', 'shijing', 'tangshi', 'songci'].includes(currentClassic);
    const nodes = [];
    const edges = [];
    
    // 中心节点
    nodes.push({
        id: 'center',
        name: currentChapter,
        type: 'center',
        relation: ''
    });
    
    const relatedPersonsSet = new Set();
    const relatedEventsSet = new Set();
    
    if (isClassic) {
        // 经典文献模式：从所有字段提取双链
        const allContent = (currentNote.original || '') + (currentNote.notes || '') + (currentNote.supplement || '') + (currentNote.translation || '');
        if (allContent) {
            const linkRegex = /\[\[([^\]]+)\]\]/g;
            let match;
            while ((match = linkRegex.exec(allContent)) !== null) {
                let linkText = match[1];
                let personName = linkText;
                const relationMatch = linkText.match(/^(.+?)[\s：:](.+)$/);
                let relation = '';
                if (relationMatch) {
                    relation = relationMatch[1];
                    personName = relationMatch[2];
                }
                if (personName && personName.trim()) {
                    relatedPersonsSet.add({ name: personName.trim(), relation: relation });
                }
            }
        }
    } else {
        // 历史人物模式
        if (currentNote.relatedPersons && currentNote.relatedPersons.length > 0) {
            currentNote.relatedPersons.forEach(item => {
                const name = typeof item === 'string' ? item : item.name;
                const relation = typeof item === 'string' ? '' : item.relation;
                relatedPersonsSet.add({ name: name, relation: relation });
            });
        }
        
        if (currentNote.content) {
            const linkRegex = /\[\[([^\]]+)\]\]/g;
            let match;
            while ((match = linkRegex.exec(currentNote.content)) !== null) {
                let linkText = match[1];
                let personName = linkText;
                const relationMatch = linkText.match(/^(.+?)[\s：:](.+)$/);
                let relation = '';
                if (relationMatch) {
                    relation = relationMatch[1];
                    personName = relationMatch[2];
                }
                if (personName && personName.trim()) {
                    relatedPersonsSet.add({ name: personName.trim(), relation: relation });
                }
            }
        }
        
        if (currentNote.relatedEvents && currentNote.relatedEvents.length > 0) {
            currentNote.relatedEvents.forEach(event => {
                relatedEventsSet.add(event);
            });
        }
        
        if (currentNote.timeline && currentNote.timeline.length > 0) {
            currentNote.timeline.forEach(person => {
                relatedPersonsSet.add({ name: person, relation: '时代相关' });
            });
        }
    }
    
    // 添加相关人物节点
    let index = 1;
    for (const person of relatedPersonsSet) {
        nodes.push({
            id: `p${index}`,
            name: person.name,
            type: 'related',
            relation: person.relation || '相关'
        });
        edges.push({ from: 'center', to: `p${index}`, label: person.relation || '相关' });
        index++;
    }
    
    // 添加相关事件节点
    for (const event of relatedEventsSet) {
        nodes.push({
            id: `e${index}`,
            name: typeof event === 'string' ? event : event.name,
            type: 'event',
            relation: '事件'
        });
        edges.push({ from: 'center', to: `e${index}`, label: '事件' });
        index++;
    }
    
    if (nodes.length <= 1) {
        document.getElementById('graphContainer').innerHTML = '<div class="no-graph-data">📭 暂无关联的人物或事件<br>💡 在正文中使用 [[关系 人名]] 添加双链</div>';
        document.getElementById('graphModal').classList.add('active');
        return;
    }
    
    renderGraphVisualization(nodes, edges, currentChapter);
    document.getElementById('graphModal').classList.add('active');
}

// 渲染可视化导图（力导向布局）
// 渲染可视化导图（力导向布局）
function renderGraphVisualization(nodes, edges, centerName) {
    const container = document.getElementById('graphContainer');
    container.innerHTML = '';
    container.style.position = 'relative';
    container.style.minHeight = '500px';
    
    const width = container.clientWidth || 750;
    const height = 500;
    const centerX = width / 2;
    const centerY = height / 2;
    const radius = Math.min(width, height) * 0.32;
    
    // 计算节点位置（圆形布局）
    const relatedNodes = nodes.filter(n => n.type !== 'center');
    const angleStep = (Math.PI * 2) / Math.max(relatedNodes.length, 1);
    
    // 存储位置（存储节点的中心点坐标）
    const positions = {};
    positions['center'] = { x: centerX, y: centerY };
    
    relatedNodes.forEach((node, i) => {
        const angle = i * angleStep - Math.PI / 2;
        const x = centerX + radius * Math.cos(angle);
        const y = centerY + radius * Math.sin(angle);
        positions[node.id] = { x, y };
    });
    
    // 先绘制连线（放在节点下面）
    edges.forEach(edge => {
        const fromPos = positions[edge.from];
        const toPos = positions[edge.to];
        if (fromPos && toPos) {
            const line = document.createElement('div');
            line.className = 'graph-line';
            
            // 计算两个中心点之间的向量
            const dx = toPos.x - fromPos.x;
            const dy = toPos.y - fromPos.y;
            const length = Math.sqrt(dx * dx + dy * dy);
            const angle = Math.atan2(dy, dx) * 180 / Math.PI;
            
            // 设置连线位置（从起点中心开始）
            line.style.position = 'absolute';
            line.style.left = `${fromPos.x}px`;
            line.style.top = `${fromPos.y}px`;
            line.style.width = `${length}px`;
            line.style.height = '2px';
            line.style.backgroundColor = '#c6c6c8';
            line.style.transformOrigin = '0 0';
            line.style.transform = `rotate(${angle}deg)`;
            line.style.borderRadius = '1px';
            
            container.appendChild(line);
        }
    });
    
    // 再绘制节点（放在连线上方）
    nodes.forEach(node => {
        const pos = positions[node.id];
        if (!pos) return;
        
        const div = document.createElement('div');
        div.className = `graph-node ${node.type}`;
        // 注意：因为节点使用 transform: translate(-50%, -50%) 居中
        // 所以设置 left/top 为节点中心点坐标
        div.style.position = 'absolute';
        div.style.left = `${pos.x}px`;
        div.style.top = `${pos.y}px`;
        div.style.transform = 'translate(-50%, -50%)';
        
        div.innerHTML = `
            <div class="node-name">${escapeHtml(node.name.length > 12 ? node.name.slice(0, 12) + '...' : node.name)}</div>
            <div class="node-type">${node.type === 'event' ? '📌' : ''}</div>
        `;
        
        div.addEventListener('click', () => {
            if (node.type !== 'center') {
                closeModal('graphModal');
                let found = false;
                for (const [classicKey, tree] of Object.entries(trees)) {
                    const leaves = getAllLeafNodes(tree);
                    const exists = leaves.find(l => l.name === node.name);
                    if (exists) {
                        if (classicKey !== currentClassic) {
                            switchClassic(classicKey);
                        }
                        currentChapter = node.name;
                        saveCurrent();
                        renderTree();
                        renderRecords();
                        showMsg(`🔗 跳转到: ${node.name}`);
                        found = true;
                        break;
                    }
                }
                if (!found) {
                    showMsg(`❌ "${node.name}" 暂未创建`);
                }
            }
        });
        
        container.appendChild(div);
    });
    
    document.getElementById('graphTitle').innerHTML = `${escapeHtml(centerName)} 的关系导图`;
}

        if (window.quillTranslation && window.quillTranslation.root) {
            translationContent = window.quillTranslation.root.innerHTML;
        }
        if (!translationContent || translationContent === '<p><br></p>') {
            const translationEl = document.querySelector('#editorTranslation .ql-editor');
            if (translationEl) translationContent = translationEl.innerHTML;
        }
        
        const noteData = {
            id: editingId || Date.now(),
            classic: currentClassic,
            chapter: currentChapter,
            original: originalContent || '',
            notes: notesContent || '',
            supplement: supplementContent || '',
            translation: translationContent || '',
            createdAt: editingId ? (notes.find(n => n.id === editingId)?.createdAt || now) : now,
            updatedAt: now
        };
        
        processBidirectionalLinksForClassic(noteData);
        
        if (editingId) {
            const idx = notes.findIndex(n => n.id === editingId);
            if (idx !== -1) notes[idx] = noteData;
            else notes.push(noteData);
        } else {
            notes.push(noteData);
        }
    } else {
        // ========== 历史人物模式（庄姜等） ==========
        // 获取生卒年
        const birthVal = document.getElementById('birthYear')?.value.trim() || '';
        const deathVal = document.getElementById('deathYear')?.value.trim() || '';
        let lifespan = (birthVal || deathVal) ? `${birthVal || '?'} - ${deathVal || '?'}` : '';
        
        // 获取正文内容
        let contentValue = '';
        if (window.quillContent && window.quillContent.root) {
            contentValue = window.quillContent.root.innerHTML;
        }
        if (!contentValue) {
            const editorEl = document.querySelector('#editorContent .ql-editor');
            if (editorEl) contentValue = editorEl.innerHTML;
        }
        
        const noteData = {
            id: editingId || Date.now(),
            classic: currentClassic,
            chapter: currentChapter,
            lifespan: lifespan,
            content: contentValue,
            relatedPersons: [...currentRelatedPersons],
            timeline: [...currentTimeline],
            relatedEvents: [...currentRelatedEvents],
            createdAt: editingId ? (notes.find(n => n.id === editingId)?.createdAt || now) : now,
            updatedAt: now
        };
        
        // 处理双向链接
        processBidirectionalLinks(noteData);
        
        if (editingId) {
            const idx = notes.findIndex(n => n.id === editingId);
            if (idx !== -1) notes[idx] = noteData;
            else notes.push(noteData);
        } else {
            notes.push(noteData);
        }
    }
    
    saveNotes();
    console.log('笔记已保存到 localStorage');
    console.log('当前所有笔记数量:', notes.length);
    autoSyncToGist();
    renderRecords();
    closeModal('noteModal');
    
    showMsg('笔记已保存 ✓');
}

// 处理历史人物模式的双向链接
function processBidirectionalLinks(currentNoteData) {
    const isClassicMode = ['lunyu', 'shijing', 'tangshi', 'songci'].includes(currentClassic);
    if (isClassicMode) return;
    
    const content = currentNoteData.content || '';
    const linkRegex = /\[\[([^\]]+)\]\]/g;
    let match;
    const links = [];
    
    // 提取当前笔记中的所有双链
    while ((match = linkRegex.exec(content)) !== null) {
        let linkText = match[1];
        let relation = '';
        let personName = linkText;
        
        const relationMatch = linkText.match(/^(.+?)[\s：:]+(.+)$/);
        if (relationMatch) {
            relation = relationMatch[1];
            personName = relationMatch[2];
        }
        
        if (personName && personName.trim()) {
            links.push({
                personName: personName.trim(),
                relation: relation.trim()
            });
        }
    }
    
    // 关系映射表
    const relationMap = {
        '朋友': '朋友', '老师': '学生', '学生': '老师',
        '父亲': '儿子', '儿子': '父亲', '母亲': '儿子',
        '哥哥': '弟弟', '弟弟': '哥哥', '师傅': '徒弟', '徒弟': '师傅'
    };
    
    // 为每个链接的人物添加反向关系
    for (const link of links) {
        let targetNote = null;
        let targetClassic = null;
        let targetChapterName = link.personName;
        
        for (const [classicKey, tree] of Object.entries(trees)) {
            const leaves = getAllLeafNodes(tree);
            const exists = leaves.find(l => {
                if (l.name === link.personName) return true;
                if (l.cleanName === link.personName) return true;
                const cleanTarget = l.name.replace(/^《|》$/g, '');
                const cleanLink = link.personName.replace(/^《|》$/g, '');
                if (cleanTarget === cleanLink) return true;
                return false;
            });
            
            if (exists) {
                targetChapterName = exists.name;
                targetNote = notes.find(n => n.classic === classicKey && n.chapter === targetChapterName);
                targetClassic = classicKey;
                break;
            }
        }
        
        if (!targetNote) {
            targetNote = {
                id: Date.now() + Math.random(),
                classic: currentClassic,
                chapter: targetChapterName,
                lifespan: '',
                content: '',
                relatedPersons: [],
                timeline: [],
                relatedEvents: [],
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString()
            };
            notes.push(targetNote);
        }
        
        if (!targetNote.relatedPersons) targetNote.relatedPersons = [];
        
        let reverseRelation = relationMap[link.relation] || link.relation;
        if (!reverseRelation) reverseRelation = '相关';
        
        const alreadyExists = targetNote.relatedPersons.some(p => {
            const pName = typeof p === 'string' ? p : p.name;
            return pName === currentNoteData.chapter;
        });
        
        if (!alreadyExists) {
            targetNote.relatedPersons.push({
                name: currentNoteData.chapter,
                relation: reverseRelation
            });
            targetNote.updatedAt = new Date().toISOString();
        }
    }
    
    saveNotes();
}

// 处理经典文献模式的双向链接
function processBidirectionalLinksForClassic(currentNoteData) {
    // 合并所有字段内容
    const allContent = (currentNoteData.original || '') + 
                       (currentNoteData.notes || '') + 
                       (currentNoteData.supplement || '') + 
                       (currentNoteData.translation || '');
    
    const linkRegex = /\[\[([^\]]+)\]\]/g;
    let match;
    const links = [];
    
    // 提取当前笔记中的所有双链
    while ((match = linkRegex.exec(allContent)) !== null) {
        let linkText = match[1];
        let relation = '';
        let personName = linkText;
        
        const relationMatch = linkText.match(/^(.+?)[\s：:]+(.+)$/);
        if (relationMatch) {
            relation = relationMatch[1];
            personName = relationMatch[2];
        }
        
        if (personName && personName.trim()) {
            links.push({
                personName: personName.trim(),
                relation: relation.trim()
            });
        }
    }
    
    // 关系映射表
    const relationMap = {
        '朋友': '朋友', '老师': '学生', '学生': '老师',
        '父亲': '儿子', '儿子': '父亲', '母亲': '儿子',
        '哥哥': '弟弟', '弟弟': '哥哥', '师傅': '徒弟', '徒弟': '师傅',
        '作者': '作品', '作品': '作者',
        '引用': '被引用', '出自': '出自'
    };
    
    // 为每个链接的人物添加反向关系
    for (const link of links) {
        // 在所有分类中查找目标人物
        let targetNote = null;
        let targetClassic = null;
        let targetChapterName = link.personName;
        
        for (const [classicKey, tree] of Object.entries(trees)) {
            const leaves = getAllLeafNodes(tree);
            // 多种匹配方式：精确匹配、忽略书名号匹配
            const exists = leaves.find(l => {
                // 直接匹配名称
                if (l.name === link.personName) return true;
                // 清理后匹配（去掉当前节点的书名号）
                if (l.cleanName === link.personName) return true;
                // 都去掉书名号后匹配
                const cleanTarget = l.name.replace(/^《|》$/g, '');
                const cleanLink = link.personName.replace(/^《|》$/g, '');
                if (cleanTarget === cleanLink) return true;
                return false;
            });
            
            if (exists) {
                targetChapterName = exists.name;
                targetNote = notes.find(n => n.classic === classicKey && n.chapter === targetChapterName);
                targetClassic = classicKey;
                break;
            }
        }
        
        if (!targetNote) {
            // 如果对方笔记不存在，在找到的分类中创建一个空笔记
            const targetClassicKey = targetClassic || currentClassic;
            
            targetNote = {
                id: Date.now() + Math.random(),
                classic: targetClassicKey,
                chapter: targetChapterName,
                lifespan: '',
                content: '',
                relatedPersons: [],
                timeline: [],
                relatedEvents: [],
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString()
            };
            notes.push(targetNote);
        }
        
        // 确保 relatedPersons 存在
        if (!targetNote.relatedPersons) targetNote.relatedPersons = [];
        
        // 计算反向关系
        let reverseRelation = relationMap[link.relation] || link.relation;
        if (!reverseRelation) reverseRelation = '相关';
        
        // 检查是否已经存在该反向关系
        const alreadyExists = targetNote.relatedPersons.some(p => {
            const pName = typeof p === 'string' ? p : p.name;
            return pName === currentNoteData.chapter;
        });
        
        if (!alreadyExists) {
            targetNote.relatedPersons.push({
                name: currentNoteData.chapter,
                relation: reverseRelation,
                sourceClassic: currentClassic
            });
            targetNote.updatedAt = new Date().toISOString();
        }
    }
    
    saveNotes();
}

function renderCatalogTree(resetCollapsed = false) {
    const container = document.getElementById('catalogTreeList');
    if (!container) return;
    container.innerHTML = '';
    
    // 获取当前分类的目录树
    const currentTree = getCurrentTree();
    
    // 初始化或重置折叠状态
    if (!window.collapsedNodes || resetCollapsed) {
        window.collapsedNodes = new Set();
        // 收集当前树中有子节点的目录 ID，默认全部折叠
        function collectAllNodeIds(nodes) {
            for (let node of nodes) {
                if (node.children && node.children.length > 0) {
                    window.collapsedNodes.add(node.id);
                    collectAllNodeIds(node.children);
                }
            }
        }
        collectAllNodeIds(currentTree);
    }
    
    // 更新父级下拉选项
    const parentSelect = document.getElementById('newRootParentSelect');
    if (parentSelect) {
        parentSelect.innerHTML = '<option value="__root__">📁 作为一级目录</option>';
        function addOptions(nodes, prefix = '') {
            for (let node of nodes) {
                const option = document.createElement('option');
                option.value = node.id;
                option.textContent = prefix + '📁 ' + node.name;
                parentSelect.appendChild(option);
                if (node.children && node.children.length > 0) {
                    addOptions(node.children, prefix + '　');
                }
            }
        }
        addOptions(currentTree);
    }
    
    // 递归渲染节点
    function renderNode(node, level = 0) {
        const hasChildren = node.children && node.children.length > 0;
        const isCollapsed = window.collapsedNodes.has(node.id);
        
        const div = document.createElement('div');
        div.className = 'edit-tree-item';
        div.style.marginLeft = (level * 20) + 'px';
        
        // 左侧区域
        const leftArea = document.createElement('div');
        leftArea.style.display = 'flex';
        leftArea.style.alignItems = 'center';
        leftArea.style.flex = '1';
        leftArea.style.gap = '6px';
        
        // 展开/收缩按钮
        if (hasChildren) {
            const toggleBtn = document.createElement('span');
            toggleBtn.textContent = isCollapsed ? '▶' : '▼';
            toggleBtn.style.cursor = 'pointer';
            toggleBtn.style.fontSize = '10px';
            toggleBtn.style.color = '#8e8e93';
            toggleBtn.style.width = '16px';
            toggleBtn.style.display = 'inline-block';
            toggleBtn.onclick = (e) => {
                e.stopPropagation();
                if (window.collapsedNodes.has(node.id)) {
                    window.collapsedNodes.delete(node.id);
                } else {
                    window.collapsedNodes.add(node.id);
                }
                renderCatalogTree(); // 重新渲染
            };
            leftArea.appendChild(toggleBtn);
        } else {
            const placeholder = document.createElement('span');
            placeholder.style.width = '22px';
            placeholder.style.display = 'inline-block';
            leftArea.appendChild(placeholder);
        }
        
        // ========== 名称（可编辑）- 已修复笔记同步 ==========
        const nameSpan = document.createElement('span');
        nameSpan.textContent = node.name;
        nameSpan.style.cursor = 'pointer';
        nameSpan.style.flex = '1';
        nameSpan.style.padding = '4px 0';
        nameSpan.title = '双击编辑名称';
        nameSpan.ondblclick = (e) => {
            e.stopPropagation();
            const oldName = node.name;  // 保存旧名称
            const newName = prompt('请输入新名称:', oldName);
            
            if (newName && newName.trim() && newName !== oldName) {
                const newNameTrimmed = newName.trim();
                
                // 1. 更新目录树中的名称
                node.name = newNameTrimmed;
                saveTrees();
                
                // 2. 🔥 关键修复：同步更新所有关联笔记的 chapter 字段
                let updatedCount = 0;
                notes = notes.map(note => {
                    if (note.classic === currentClassic && note.chapter === oldName) {
                        updatedCount++;
                        console.log(`同步笔记: "${oldName}" -> "${newNameTrimmed}"`);
                        return { 
                            ...note, 
                            chapter: newNameTrimmed, 
                            updatedAt: new Date().toISOString() 
                        };
                    }
                    return note;
                });
                
                if (updatedCount > 0) {
                    saveNotes();
                    console.log(`已同步 ${updatedCount} 条笔记`);
                }
                
                // 3. 如果当前正在查看被重命名的章节，更新 currentChapter
                if (currentChapter === oldName) {
                    currentChapter = newNameTrimmed;
                    saveCurrent();
                    console.log(`当前章节已同步: "${oldName}" -> "${newNameTrimmed}"`);
                }
                
                // 4. 刷新所有界面
                renderTree();
                renderCatalogTree();
                renderRecords();  // 强制刷新笔记显示
                
                showMsg(updatedCount > 0 
                    ? `✅ 已重命名「${oldName}」为「${newNameTrimmed}」，并同步了 ${updatedCount} 条笔记` 
                    : `✅ 目录已重命名「${oldName}」为「${newNameTrimmed}」`);
            }
        };
        leftArea.appendChild(nameSpan);
        
        // 操作按钮
        const actions = document.createElement('div');
        actions.className = 'edit-tree-actions';
        
        // 添加子目录按钮
        const addBtn = document.createElement('button');
        addBtn.className = 'action-btn';
        addBtn.innerHTML = '📁+';
        addBtn.title = '添加子目录';
        addBtn.onclick = (e) => {
            e.stopPropagation();
            const subName = prompt('请输入子目录名称:');
            if (subName && subName.trim()) {
                if (!node.children) node.children = [];
                node.children.push({ id: genId(), name: subName.trim(), children: [] });
                saveTrees();
                renderTree();
                renderCatalogTree();
                showMsg(`已添加「${subName}」到「${node.name}」`);
            }
        };
        
        // 删除按钮
        const delBtn = document.createElement('button');
        delBtn.className = 'action-btn delete-item';
        delBtn.innerHTML = '🗑️';
        delBtn.title = '删除目录';
        delBtn.onclick = (e) => {
            e.stopPropagation();
            if (confirm(`确定要删除「${node.name}」及其所有子目录吗？\n\n⚠️ 注意：该目录下的笔记不会被自动删除，但可能无法通过目录访问。`)) {
                function deleteNode(nodes, targetId) {
                    for (let i = 0; i < nodes.length; i++) {
                        if (nodes[i].id === targetId) {
                            nodes.splice(i, 1);
                            return true;
                        }
                        if (nodes[i].children && deleteNode(nodes[i].children, targetId)) {
                            return true;
                        }
                    }
                    return false;
                }
                deleteNode(getCurrentTree(), node.id);
                window.collapsedNodes.delete(node.id);
                saveTrees();
                renderTree();
                renderCatalogTree();
                showMsg(`已删除「${node.name}」`);
            }
        };
        
        actions.appendChild(addBtn);
        actions.appendChild(delBtn);
        
        div.appendChild(leftArea);
        div.appendChild(actions);
        container.appendChild(div);
        
        // 渲染子节点（仅当未折叠且有子节点时）
        if (hasChildren && !isCollapsed) {
            node.children.forEach(child => renderNode(child, level + 1));
        }
    }
    
    currentTree.forEach(node => renderNode(node, 0));
}

function renderNode(parentEl, node, level) {
    const div = document.createElement('div');
    div.className = 'tree-node';
    const hasChildren = node.children && node.children.length > 0;
    const header = document.createElement('div');
    if (level === 1) header.className = 'level-1';
    else if (level === 2) header.className = 'level-2';
    else header.className = 'level-3';
    
    // 检查当前节点是否有笔记内容
    const hasContent = checkNodeHasContent(node.name);
    
    // 如果有内容，添加一个特殊类名，用于变色
    if (hasContent) {
        header.classList.add('has-content');
    }
    
    let chevronHtml = '';
    if (hasChildren) {
        chevronHtml = `<span class="chevron" style="margin-right: 4px; margin-left: 0; width: 18px; display: inline-block; text-align: center; flex-shrink: 0;">›</span>`;
    } else {
        chevronHtml = `<span style="width: 18px; display: inline-block; flex-shrink: 0;"></span>`;
    }
    
    // 加号按钮 - 默认隐藏，电脑端悬停显示
    const addBtnHtml = `<span class="tree-add-btn" data-node-id="${node.id}" style="cursor: pointer; margin-left: 8px; font-size: 14px; color: #61A2DA; font-weight: bold;">+</span>`;
    
    header.innerHTML = `<div style="display:flex; align-items:center; flex:1; min-width:0;">${chevronHtml}<span class="node-title" style="flex:1; word-break: break-word;">${escapeHtml(node.name)}</span>${addBtnHtml}</div><div style="display:flex; align-items:center; flex-shrink: 0;"></div>`;
    
    // 获取加号按钮
    const addBtn = header.querySelector('.tree-add-btn');
    
    
    
    // 检查是否为电脑端（宽度大于768px）
    const isDesktop = window.innerWidth > 768;
    
    if (isDesktop) {
        // 电脑端：默认隐藏，悬停在整个目录行上时显示
        addBtn.style.opacity = '0';
        addBtn.style.transition = 'opacity 0.2s';
        
        header.addEventListener('mouseenter', () => {
            addBtn.style.opacity = '1';
        });
        header.addEventListener('mouseleave', () => {
            addBtn.style.opacity = '0';
        });
    } else {
        // 手机端：显示小加号，不隐藏
        addBtn.style.opacity = '1';
        addBtn.style.fontSize = '12px';  // 小一点
        addBtn.style.width = '24px';
        addBtn.style.height = '24px';
        addBtn.style.display = 'inline-flex';
        addBtn.style.alignItems = 'center';
        addBtn.style.justifyContent = 'center';
    }
    
    if (currentChapter === node.name) header.classList.add('active-chapter');
    
    const titleSpan = header.querySelector('.node-title');
    titleSpan.addEventListener('click', (e) => {
        e.stopPropagation();
        selectChapter(node.name);
    });
    
   // 加号按钮点击事件 - 添加子目录（使用自定义模态窗）
if (addBtn) {
    addBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        showCustomInput(
            `在「${node.name}」下添加子目录`,
            '新目录',
            (subName) => {
                if (subName && subName.trim()) {
                    if (!node.children) node.children = [];
                    node.children.push({ id: genId(), name: subName.trim(), children: [] });
                    saveTrees();
                    renderTree();
                    expandedNodes.add(node.id);
                    renderTree();
                    showMsg(`✅ 已添加「${subName}」到「${node.name}」`);
                }
            }
        );
    });
}
    if (hasChildren) {
        const childrenDiv = document.createElement('div');
        childrenDiv.className = 'children-container';
        node.children.forEach(child => renderNode(childrenDiv, child, level + 1));
        if (expandedNodes.has(node.id)) childrenDiv.classList.add('open');
        div.appendChild(header);
        div.appendChild(childrenDiv);
        
        const chevSpan = header.querySelector('.chevron');
        if (chevSpan) {
            chevSpan.addEventListener('click', (e) => {
                e.stopPropagation();
                const isOpen = childrenDiv.classList.contains('open');
                if (isOpen) {
                    childrenDiv.classList.remove('open');
                    chevSpan.classList.remove('open');
                    expandedNodes.delete(node.id);
                } else {
                    childrenDiv.classList.add('open');
                    chevSpan.classList.add('open');
                    expandedNodes.add(node.id);
                }
            });
        }
    } else {
        div.appendChild(header);
    }
    parentEl.appendChild(div);
}


// 检查节点是否有笔记内容
function checkNodeHasContent(nodeName) {
    const note = notes.find(n => n.classic === currentClassic && n.chapter === nodeName);
    if (!note) return false;
    
    const isClassic = ['lunyu', 'shijing', 'tangshi', 'songci'].includes(currentClassic);
    
    if (isClassic) {
        // 经典文献模式：检查原文、注释、补充、译文是否有内容
        return (note.original && note.original !== '<p><br></p>') ||
               (note.notes && note.notes !== '<p><br></p>') ||
               (note.supplement && note.supplement !== '<p><br></p>') ||
               (note.translation && note.translation !== '<p><br></p>');
    } else {
        // 历史人物模式：检查 content 是否有内容
        return note.content && note.content !== '<p><br></p>';
    }
}

function updateModalRelatedPersons() {
    const container = document.getElementById('modalRelatedPersonsContainer');
    if (!container) return;
    
    const relatedPersonsSet = new Set();
    
    // 从所有编辑器中提取双链（同时支持经典文献和历史人物模式）
    const editors = [
        window.quillOriginal,
        window.quillNotes,
        window.quillSupplement,
        window.quillTranslation,
        window.quillContent
    ];
    
    let hasContent = false;
    editors.forEach(editor => {
        if (editor && editor.root) {
            hasContent = true;
            const content = editor.root.innerHTML;
            const linkRegex = /\[\[([^\]]+)\]\]/g;
            let match;
            while ((match = linkRegex.exec(content)) !== null) {
                let linkText = match[1];
                let personName = linkText;
                
                // 尝试提取关系和人名（支持：关系 人名、关系：人名、关系:人名）
                const relationMatch = linkText.match(/^(.+?)[\s：:](.+)$/);
                if (relationMatch) {
                    personName = relationMatch[2];
                }
                
                if (personName && personName.trim()) {
                    relatedPersonsSet.add(personName.trim());
                }
            }
        }
    });
    
    if (relatedPersonsSet.size > 0) {
        let html = '';
        relatedPersonsSet.forEach(personName => {
            html += `<span style="display:inline-flex; background:#e9e9ef; padding:6px 14px; border-radius:20px; font-size:13px; color:#61A2DA;">${escapeHtml(personName)}</span>`;
        });
        container.innerHTML = html;
    } else {
        container.innerHTML = '<span style="color: #aeaeb2; font-size: 13px;">暂无，在正文中使用 [[关系 人名]] 添加</span>';
    }
}

        const range = this.quill.getSelection();
        if (range && range.length > 0) {
            // 有选中文字
            const text = this.quill.getText(range.index, range.length);
            // 删除选中的文字
            this.quill.deleteText(range.index, range.length);
            // 插入 [[选中的文字]]
            this.quill.insertText(range.index, `[[${text}]]`);
            // 设置光标位置
            this.quill.setSelection(range.index + text.length + 4, 0);
        } else {
            // 没有选中文字，直接插入 [[]]，光标放在中间

            this.quill.insertText(cursorPos, '[[]]');

                        window.quillContent.deleteText(range.index, range.length);
                        window.quillContent.insertText(range.index, `[[${text}]]`);
                        window.quillContent.setSelection(range.index + text.length + 4, 0);
                    } else {
                        const cursorPos = window.quillContent.getLength();
                        window.quillContent.insertText(cursorPos, '[[]]');
                        window.quillContent.setSelection(cursorPos + 2, 0);
                    }
                }
            });
        }
    }
}

function performSearch() {
    const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
    if (!keyword) {
        document.getElementById('searchResults').innerHTML = '<div style="color: #8e8e93; text-align: center; padding: 40px;">请输入搜索关键词</div>';
        return;
    }
    
    const results = [];
    const categoryNames = {
        'china': '中国历史',
        'world': '世界历史',
        'lunyu': '论语',
        'shijing': '诗经',
        'tangshi': '唐诗',
        'songci': '宋词'
    };
    
    notes.forEach(note => {
        const category = categoryNames[note.classic] || note.classic;
        const isClassic = ['lunyu', 'shijing', 'tangshi', 'songci'].includes(note.classic);
        
        if (note.chapter.toLowerCase().includes(keyword)) {
            results.push({
                category: category,
                classic: note.classic,
                chapter: note.chapter,
                field: 'chapter',
                preview: `章节：${note.chapter}`,
                content: note.chapter
            });
        }
        
        if (isClassic) {
            const fields = [
                { name: '原文', content: note.original, key: 'original' },
                { name: '注释', content: note.notes, key: 'notes' },
                { name: '补充', content: note.supplement, key: 'supplement' },
                { name: '译文', content: note.translation, key: 'translation' }
            ];
            fields.forEach(field => {
                if (field.content && field.content !== '<p><br></p>') {
                    const plainText = stripHtml(field.content).toLowerCase();
                    if (plainText.includes(keyword)) {
                        const preview = getPreview(stripHtml(field.content), keyword);
                        results.push({
                            category: category,
                            classic: note.classic,
                            chapter: note.chapter,
                            field: field.name,
                            preview: preview,
                            content: field.content,
                            contentKey: field.key
                        });
                    }
                }
            });
        } else {
            if (note.content && note.content !== '<p><br></p>') {
                const plainText = stripHtml(note.content).toLowerCase();
                if (plainText.includes(keyword)) {
                    const preview = getPreview(stripHtml(note.content), keyword);
                    results.push({
                        category: category,
                        classic: note.classic,
                        chapter: note.chapter,
                        field: '生平与成就',
                        preview: preview,
                        content: note.content,
                        contentKey: 'content'
                    });
                }
            }
            if (note.relatedPersons && note.relatedPersons.length > 0) {
                note.relatedPersons.forEach(person => {
                    const personName = typeof person === 'string' ? person : person.name;
                    if (personName.toLowerCase().includes(keyword)) {
                        results.push({
                            category: category,
                            classic: note.classic,
                            chapter: note.chapter,
                            field: '相关人物',
                            preview: `👥 ${personName}`,
                            content: null
                        });
                    }
                });
            }
            if (note.relatedEvents && note.relatedEvents.length > 0) {
                note.relatedEvents.forEach(event => {
                    if (event.toLowerCase().includes(keyword)) {
                        results.push({
                            category: category,
                            classic: note.classic,
                            chapter: note.chapter,
                            field: '相关事件',
                            preview: `📌 ${event}`,
                            content: null
                        });
                    }
                });
            }
            if (note.timeline && note.timeline.length > 0) {
                note.timeline.forEach(timeline => {
                    if (timeline.toLowerCase().includes(keyword)) {
                        results.push({
                            category: category,
                            classic: note.classic,
                            chapter: note.chapter,
                            field: '时代线',
                            preview: `📅 ${timeline}`,
                            content: null
                        });
                    }
                });
            }
        }
    });
    
    const uniqueResults = [];
    const seen = new Set();
    results.forEach(result => {
        const key = `${result.classic}|${result.chapter}|${result.field}`;
        if (!seen.has(key)) {
            seen.add(key);
            uniqueResults.push(result);
        }
    });
    
    renderSearchResults(uniqueResults, keyword);
}

function stripHtml(html) {
    if (!html) return '';
    const temp = document.createElement('div');
    temp.innerHTML = html;
    return temp.textContent || temp.innerText || '';
}

function getPreview(text, keyword, maxLen = 120) {
    const lowerText = text.toLowerCase();
    const index = lowerText.indexOf(keyword.toLowerCase());
    if (index === -1) return text.substring(0, maxLen) + '...';
    
    let start = Math.max(0, index - 40);
    let end = Math.min(text.length, index + keyword.length + 60);
    let preview = text.substring(start, end);
    if (start > 0) preview = '...' + preview;
    if (end < text.length) preview = preview + '...';
    
    const regex = new RegExp(`(${escapeRegExp(keyword)})`, 'gi');
    preview = preview.replace(regex, '<mark class="search-result-highlight">$1</mark>');
    return preview;
}

function escapeRegExp(string) {
    return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function renderSearchResults(results, keyword) {
    const container = document.getElementById('searchResults');
    if (results.length === 0) {
        container.innerHTML = `<div style="color: #8e8e93; text-align: center; padding: 40px;">未找到 "${escapeHtml(keyword)}" 的相关内容</div>`;
        return;
    }
    
    let html = `<div style="margin-bottom: 12px; color: #61A2DA; font-size: 13px;">找到 ${results.length} 条结果</div>`;
    results.forEach(result => {
        html += `
    <div class="search-result-item" data-classic="${escapeHtml(result.classic)}" data-chapter="${escapeHtml(result.chapter)}" data-field="${escapeHtml(result.field)}">
        <div class="search-result-category">${escapeHtml(result.category)}</div>
        <div class="search-result-title">${escapeHtml(result.chapter)}</div>
        <div style="font-size: 12px; color: #8e8e93; margin-bottom: 6px;">${escapeHtml(result.field)}</div>
        <div class="search-result-preview">${result.preview || '...'}</div>
    </div>
`;
    });
    container.innerHTML = html;
    
    container.querySelectorAll('.search-result-item').forEach(item => {
        item.addEventListener('click', () => {
            const classic = item.dataset.classic;
            const chapter = item.dataset.chapter;
            
            if (classic !== currentClassic) {
                switchClassic(classic);
            }
            currentChapter = chapter;
            saveCurrent();
            renderTree();
            renderRecords();
            closeModal('searchModal');
            showMsg(`已跳转到: ${chapter}`);
        });
    });
}

    const confirmBtn = document.getElementById('customInputConfirmBtn');
    const input = document.getElementById('customInputValue');

            const value = input.value.trim();
            if (value && customInputCallback) {
                customInputCallback(value);
            }
            closeCustomInput();
        };

                if (value && customInputCallback) {

                }

                        if (node.id === parentId) {
                            if (!node.children) node.children = [];
                            node.children.push({ id: genId(), name: newName, children: [] });
                            return true;
                        }
                        if (node.children && addChildToParent(node.children)) return true;
                    }
                    return false;
                }
                if (!addChildToParent(currentTree)) {
                    alert('未找到父目录');

                }

    }
    
    if (token) localStorage.setItem(PAGE_ID + '_github_token', token);
    if (gistId) localStorage.setItem(PAGE_ID + '_gist_id', gistId);
    
    showSyncStatus('✅ 当前网页的 Token 和 Gist ID 已保存', 'success');
    
    // 重新验证显示
    loadGistSettings();
}

function loadGistSettings() {
    const savedToken = localStorage.getItem(PAGE_ID + '_github_token');
    const savedGistId = localStorage.getItem(PAGE_ID + '_gist_id');
    
    const tokenInput = document.getElementById('githubToken');
    const gistIdInput = document.getElementById('gistIdInput');
    
    if (savedToken) {
        tokenInput.value = savedToken;
        // 显示完整 Token（不隐藏）
        tokenInput.type = 'text';
    }
    if (savedGistId) gistIdInput.value = savedGistId;
    
    // 验证 Token 后4位
    if (savedToken && savedToken.length >= 4) {
        const suffix = savedToken.slice(-4);
        const syncDiv = document.getElementById('syncStatus');
        if (syncDiv) {
            if (suffix === 'sZ8y') {
                syncDiv.innerHTML = `✅ Token 有效 (后4位: ${suffix})`;
                syncDiv.style.color = '#2e7d32';
            } else {
                syncDiv.innerHTML = `⚠️ Token 后4位 "${suffix}" 不正确，应为 "sZ8y"`;
                syncDiv.style.color = '#ff3b30';
            }
        }
    }
    
    return savedToken && savedGistId;
}
    function showSyncStatus(msg, type) { 
        const div = document.getElementById('syncStatus'); 
        if(div) { 
            div.innerText = msg; 
            div.style.color = type === 'error' ? '#ff3b30' : (type === 'success' ? '#2e7d32' : '#8e8e93'); 
        } 
        setTimeout(() => { if(div) div.innerText = ''; }, 3000); 
    }
    
// ==================== 自动静默同步函数 ====================
function autoSyncToGist(showTip = false) {
    const token = localStorage.getItem(PAGE_ID + '_github_token');
    const gistId = localStorage.getItem(PAGE_ID + '_gist_id');
    
    if (!token || !gistId) {
        if (showTip) showMsg('⚠️ 未配置 Gist，无法同步');
        return;
    }
    
    // 验证 Token 后4位
    if (token.length >= 4) {
        const suffix = token.slice(-4);
        if (suffix !== 'sZ8y') {
            console.log('⚠️ Token 后4位不正确，跳过同步');
            if (showTip) showMsg('⚠️ Token 无效，请重新设置');
            return;
        }
    }
    
    // 清除之前的防抖定时器
    if (syncDebounceTimer) {
        clearTimeout(syncDebounceTimer);
    }
    
    // 设置新的防抖定时器（5秒后执行）
    syncDebounceTimer = setTimeout(async () => {
        if (isSyncing) {
            console.log('⏳ 已有同步进行中，跳过');
            return;
        }
        
        isSyncing = true;
        
        const uploadBtn = document.getElementById('headerSaveToGistBtnDesktop') || document.getElementById('headerSaveToGistBtn');
        setButtonLoading(uploadBtn, true);
        
        if (showTip) showMsg('☁️ 正在同步...');
        
        const backupData = {
            version: '1.0',
            backupTime: new Date().toISOString(),
            notes: notes,
            trees: trees
        };
        
        try {
            const getRes = await fetch(`https://api.github.com/gists/${gistId}`, {
                headers: { 'Authorization': `token ${token}` }
            });
            if (!getRes.ok) throw new Error('获取 Gist 失败');
            
            const gistData = await getRes.json();
            const filename = Object.keys(gistData.files)[0] || 'history_backup.json';
            
            const updateRes = await fetch(`https://api.github.com/gists/${gistId}`, {
                method: 'PATCH',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    files: { [filename]: { content: JSON.stringify(backupData, null, 2) } }
                })
            });
            
            if (!updateRes.ok) throw new Error(`上传失败: ${updateRes.status}`);
            
            lastSyncTime = Date.now();
            if (showTip) showMsg('✅ 同步成功');
            else showMsg('✅ 已同步到云端');
            
        } catch (err) {
            console.warn('同步失败:', err);
            if (showTip) showMsg('❌ 同步失败: ' + err.message);
            else showMsg('❌ 同步失败');
        } finally {
            setButtonLoading(uploadBtn, false);
            isSyncing = false;
            syncDebounceTimer = null;
        }
    }, 5000);
}

function init() { 
    localStorage.setItem('return_stack', JSON.stringify([]));
    localStorage.removeItem('return_classic');
    localStorage.removeItem('return_chapter');

    loadTrees(); 
    loadNotes(); 
    bindCustomInputEvents(); 
    
    // 清理重复笔记
    const seen = new Map();
    const uniqueNotes = [];
    for (let note of notes) {
        const key = `${note.classic}|${note.chapter}`;
        if (!seen.has(key) || seen.get(key).id < note.id) {
            if (seen.has(key)) {
                const idx = uniqueNotes.findIndex(n => n.classic === note.classic && n.chapter === note.chapter);
                if (idx !== -1) uniqueNotes.splice(idx, 1);
            }
            seen.set(key, note);
            uniqueNotes.push(note);
        }
    }
    if (uniqueNotes.length !== notes.length) {
        notes = uniqueNotes;
        saveNotes();
        console.log('清理了重复笔记');
    }
    migrateOldNotes(); 
    loadCurrent(); 
    
    bindEvents(); 
    bindLifespanEvents();  
    updateClassicUI(); 
    renderTree(); 
    renderRecords(); 
    
    // ✅ 添加：强制修复侧边栏高度
    setTimeout(function() {
        const sidebar = document.querySelector('.sidebar');
        const twoColumns = document.querySelector('.two-columns');
        const appContainer = document.querySelector('.app-container');
        if (sidebar) sidebar.style.height = '100%';
        if (twoColumns) twoColumns.style.flex = '1';
        if (appContainer) appContainer.style.height = '100vh';
    }, 100);
    
    showMsg('历史文库已就绪 — 点击卡片正文编辑，点击标签跳转'); 
// ========== 首次打开自动从云端恢复 ==========
// ========== 打开时从云端合并数据（不覆盖本地） ==========
setTimeout(async () => {
    const token = localStorage.getItem(PAGE_ID + '_github_token');
    const gistId = localStorage.getItem(PAGE_ID + '_gist_id');
    
    if (!token || !gistId) return;
    
    // 检查今天是否已经合并过
    const today = new Date().toISOString().split('T')[0];
    const lastMergeDate = localStorage.getItem(LAST_MERGE_DATE_KEY);
    
    if (lastMergeDate === today) {
        console.log('📅 今天已经合并过云端数据，跳过');
        return;
    }
    
    console.log('🔄 正在从云端合并数据...');
    showMsg('☁️ 正在同步云端数据...');
    
    try {
        const res = await fetch(`https://api.github.com/gists/${gistId}`, {
            headers: { 'Authorization': `token ${token}` }
        });
        if (res.ok) {
            const gistData = await res.json();
            const firstFile = gistData.files[Object.keys(gistData.files)[0]];
            if (firstFile?.content) {
                const backupData = JSON.parse(firstFile.content);
                let addedCount = 0;
                let updatedCount = 0;
                
                // 合并笔记（按更新时间判断，保留最新版本）
                if (backupData.notes && Array.isArray(backupData.notes)) {
                    for (const cloudNote of backupData.notes) {
                        const key = `${cloudNote.classic}|${cloudNote.chapter}`;
                        const existingIndex = notes.findIndex(n => `${n.classic}|${n.chapter}` === key);
                        
                        if (existingIndex === -1) {
                            notes.push(cloudNote);
                            addedCount++;
                        } else {
                            const localNote = notes[existingIndex];
                            const localTime = new Date(localNote.updatedAt || localNote.createdAt || '1970-01-01');
                            const cloudTime = new Date(cloudNote.updatedAt || cloudNote.createdAt || '1970-01-01');
                            
                            if (cloudTime > localTime) {
                                notes[existingIndex] = cloudNote;
                                updatedCount++;
                            }
                        }
                    }
                    
                    if (addedCount > 0 || updatedCount > 0) {
                        saveNotes();
                        console.log(`✅ 云端合并完成: 新增 ${addedCount} 条，更新 ${updatedCount} 条`);
                        renderTree();
                        renderRecords();
                        showMsg(`📦 已同步: 新增 ${addedCount} 条，更新 ${updatedCount} 条`);
                    } else {
                        console.log('📦 云端数据已是最新');
                    }
                }
                
                // 记录今天已合并
                localStorage.setItem(LAST_MERGE_DATE_KEY, today);
            }
        }
    } catch (err) {
        console.log('云端合并失败:', err);
    }
}, 500);



}



    
    init();
    
</script>
